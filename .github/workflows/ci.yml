name: CI

on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  build:
    name: build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: expenses_test
          POSTGRES_USER: expenses_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenses_app -d expenses_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USERNAME: expenses_app
      DB_PASSWORD: ci-only-password
