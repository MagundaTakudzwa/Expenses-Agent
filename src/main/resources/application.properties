spring.application.name=expenses

spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expenses}
spring.datasource.username=${DB_USERNAME:expenses_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# JWT login tokens. The secret comes from local.properties (or the server's environment).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=expenses-api
app.jwt.access-token-ttl=8h